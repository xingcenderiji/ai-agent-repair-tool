name: Build and Release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: AI-Agent-Repair-macOS
          - os: windows-latest
            artifact_name: AI-Agent-Repair-Windows
          - os: ubuntu-latest
            artifact_name: AI-Agent-Repair-Linux
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build
      run: |
        pyinstaller --onefile --name ${{ matrix.artifact_name }} --noconsole gui.py
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          dist/${{ matrix.artifact_name }}
          dist/${{ matrix.artifact_name }}.exe
        if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: List files
      run: find dist -type f | sort

    - name: Determine tag
      id: tag
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: AI Agent Repair Tool ${{ steps.tag.outputs.tag }}
        body: |
          ## AI Agent Repair Tool ${{ steps.tag.outputs.tag }}

          Automatically detect and repair AI development tools.

          ### Downloads

          | Platform | File |
          |----------|------|
          | macOS (Universal) | `AI-Agent-Repair-macOS` |
          | Windows | `AI-Agent-Repair-Windows.exe` |
          | Linux | `AI-Agent-Repair-Linux` |

          ### Usage
          1. Download the file for your platform
          2. Windows: Double-click `.exe`
          3. Mac: `./AI-Agent-Repair-macOS` in terminal
          4. Linux: `./AI-Agent-Repair-Linux` in terminal
          5. Browser opens → Scan → Confirm → Repair

          ### Supported Tools (11)
          Cursor, Windsurf, Cline, Continue, GitHub Copilot, Claude Code, OpenCode, Aider, Roo Code, Augment Code, Hermes-Agent
        files: dist/**/*
        update_prerelease: false
        remove_artifacts: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
