name: Build and Release

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact_name: AI-Agent-Repair-macOS
            file_name: AI-Agent-Repair
          - os: windows-latest
            artifact_name: AI-Agent-Repair-Windows
            file_name: AI-Agent-Repair.exe
          - os: ubuntu-latest
            artifact_name: AI-Agent-Repair-Linux
            file_name: AI-Agent-Repair
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: pip install pyinstaller

    - name: Build
      run: pyinstaller --onefile --name AI-Agent-Repair --noconsole gui.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/${{ matrix.file_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: dist

    - name: List artifacts
      run: find dist -type f -name "*AI-Agent*" | sort

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: AI Agent Repair Tool ${{ github.ref_name }}
        body: |
          ## AI Agent Repair Tool ${{ github.ref_name }}

          Automatically detect and repair AI development tools.

          ### Downloads

          | Platform | File |
          |----------|------|
          | macOS (Universal) | `AI-Agent-Repair-macOS` |
          | Windows | `AI-Agent-Repair-Windows.exe` |
          | Linux | `AI-Agent-Repair-Linux` |

          ### Usage
          1. Download the file for your platform
          2. Windows: Double-click `.exe`
          3. Mac/Linux: `./AI-Agent-Repair` in terminal
          4. Browser opens → Scan → Confirm → Repair

          ### Supported Tools (11)
          Cursor, Windsurf, Cline, Continue, GitHub Copilot, Claude Code, OpenCode, Aider, Roo Code, Augment Code, Hermes-Agent
        files: dist/**
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
